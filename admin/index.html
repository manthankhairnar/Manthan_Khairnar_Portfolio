<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Portfolio CMS</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar" id="mobileNav">
    <div class="brand"><span class="mark">MK</span><span>Portfolio CMS</span></div>
    <nav id="dashNav"></nav>
    <div class="sidebar-footer">
      <span id="adminEmail"></span>
      <button class="logout-btn" id="logoutBtn">Log out</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div class="topbar-left">
        <button class="mobile-nav-toggle" id="mobileNavToggle">☰</button>
        <span id="lastSavedLabel" class="mono">Not saved yet this session</span>
      </div>
      <div class="unsaved-flag" id="unsavedFlag">Unsaved changes</div>
    </div>
    <div class="panel-container" id="panelContainer"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui-utils.js"></script>
<script src="js/table-config.js"></script>
<script src="js/media.js"></script>
<script src="js/crud.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
