<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Manthan Khairnar Portfolio</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand"><span class="mark">MK</span><span>Portfolio CMS</span></div>
    <h1>Admin sign in</h1>
    <p class="sub">Authorized access only — this account must match the configured admin UUID.</p>
    <form id="loginForm">
      <div class="login-field"><label>Email</label><input type="email" id="email" required autocomplete="username"></div>
      <div class="login-field"><label>Password</label><input type="password" id="password" required autocomplete="current-password"></div>
      <button type="submit" class="login-btn" id="loginBtn">Sign in</button>
      <div class="login-msg" id="loginMsg"></div>
    </form>
    <p class="login-note">Public visitors never see this page linked anywhere on the site — it only exists at <code>/admin/login.html</code>. Access is enforced by Supabase Auth + Row Level Security, not by hiding this URL.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const msg = document.getElementById("loginMsg");
  if (params.get("unauthorized")) { msg.textContent = "That account is not authorized for admin access."; msg.classList.add("show", "err"); }
  if (params.get("expired")) { msg.textContent = "Your session expired — please sign in again."; msg.classList.add("show", "info"); }

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("loginBtn");
    btn.disabled = true; btn.textContent = "Signing in…";
    msg.classList.remove("show", "err", "info");

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const result = await doLogin(email, password);

    if (result.ok) {
      window.location.href = "login.html";
    } else {
      msg.textContent = result.message || "Login failed.";
      msg.classList.add("show", "err");
      btn.disabled = false; btn.textContent = "Sign in";
    }
  });

  // If already logged in as the admin, skip straight to the dashboard.
  (async () => {
    const { data: { session } } = await window.sb.auth.getSession();
    if (session && (!window.ADMIN_UUID || window.ADMIN_UUID === "8a0ef80c-5da9-4ef4-9c7b-fbed49220468" || session.user.id === window.ADMIN_UUID)) {
      window.location.href = "login.html";";
    }
  })();
</script>
</body>
</html>
